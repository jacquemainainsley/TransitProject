# title-bold: "Ainsley Jacquemain Transit Project Website"
# title-normal: "Exoplanet Biosignatures with the Transit Method"
title: "Exploring Exoplanet Biosignatures"
landing-title: "Exploring Exoplanet Biosignatures"
show_tile: false

email: "jacquemain.ainsley@gmail.com"
description: >- # this means to ignore newlines until "baseurl:"
  "Exploring exoplanet biosignatures with transit data."
baseurl: "/TransitProject" # the subpath of your site, e.g. /blog
author: "Ainsley Jacquemain"
url: "https://jacquemainainsley.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
remote_theme: "andrewbanchich/forty-jekyll-theme"
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  
# Contact settings
street_address: "McPherson Laboratory, 140 W 18th Ave"
city: "Columbus"
state: "OH"
zip_code: "43210"
country: "United States of America"
phone: "(614) 292-1773"

# Homepage tiles
tiles-source: pages
tiles-count: 2

---

This project investigates photon counts across four potential biosignature gas ranges for a selection of transiting exoplanets.

Using two independent methods, you can explore the photon counts for individual planets or compare the results between methods.

[Explore Photon Counts]({{ '/explorer.html' | relative_url }})

[Compare the Methods]({{ '/comparison.html' | relative_url }})












  
